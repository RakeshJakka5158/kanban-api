spring.application.name=kanban-api
spring.datasource.url=jdbc:mysql://localhost:3306/kanbanflow_db
spring.datasource.username=root
spring.datasource.password=5158
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security Properties
spring.security.user.name=user
spring.security.user.password=password

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=rakeshjakka9@gmail.com
spring.mail.password=ubfzcyliewrcmrqa

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Actuator
management.server.port=9090
management.endpoints.web.exposure.include=health,info,beans,mappings,app-stats,metrics
management.endpoint.health.show-details=always

# Custom Application Info
info.app.name=KanbanFlow API
info.app.description=A backend service for a collaborative project management tool.
info.app.version=1.0.0

#Spring Profiles
spring.profiles.active=dev

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# File Upload Configuration
# Max file size for a single file
spring.servlet.multipart.max-file-size=2MB
# Max size for the entire multipart request
spring.servlet.multipart.max-request-size=2MB

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kanban-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Let JsonDeserializer trust our package or use type headers
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kanbanflow.kanban_api.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.kanbanflow.kanban_api.dto.UserRegistrationRequestDto